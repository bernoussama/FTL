[package]
name = "ftl-rs"
version = "0.1.0"
edition = "2021"
license = "EUPL-1.2"
description = "Rust parts of Pi-hole FTL, linked into pihole-FTL as a static library"
publish = false

[lib]
name = "ftl_rs"
crate-type = ["staticlib"]
path = "src/lib.rs"

# Vendored in rust/vendor/ (see README.md) so builds stay offline.
# idna_adapter 1.1 selects the unicode-rs back end (unicode-normalization,
# unicode-bidi) instead of ICU4X, which is much larger.
[dependencies]
idna = "1.1"
idna_adapter = "~1.1"
# DEFLATE for gzip and zip (Phase 3): the Rust port of miniz, which the C
# code uses. Default features only (alloc, no SIMD).
miniz_oxide = "0.8"

# No panic may unwind into C (docs/rust-rewrite-plan.md, ground rules)
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true
